name: Build and Push Proxy Image

# Build the Qwen3-ASR proxy sidecar image and push it to the shared registry
# namespace consumed by the GPU Function templates.
#
# Mirrors siliconflow/vllm_agent + siliconflow/sglang_agent's docker-build.yml.
#
# Tag rule: {YYYYMMDD}-v{VERSION} from VERSION (no GPU suffix — this image is
# pure Python / architecture-independent), identical to the tag format
# previously produced from Qwen3-ASR/proxy/ so that already-published tags
# (e.g. 20260914-v1.0.0) stay valid.
#
# Triggers:
#   - workflow_dispatch: manual (after review)
#   - push to main / feat/sf-gpu-function-adaptation
#   - pull_request: build only, never push

on:
  push:
    branches: [main, feat/sf-gpu-function-adaptation]
  pull_request:
    branches: [main, feat/sf-gpu-function-adaptation]
  workflow_dispatch:
    inputs:
      force_build:
        description: '强制构建（跳过 tag 存在性检查）'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: hub.6scloud.com
  NAMESPACE: d1r7umcsfi9c73b4drdg
  IMAGE_NAME: qwen3-asr-proxy

jobs:
  build-and-push:
    name: Build proxy image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read VERSION file
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          if [[ -z "$VERSION" ]]; then
            echo "ERROR: VERSION file is empty"
            exit 1
          fi
          DATE_TAG=$(date -u +%Y%m%d)
          FULL_TAG="${DATE_TAG}-v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "full_tag=$FULL_TAG" >> "$GITHUB_OUTPUT"
          echo "========================================"
          echo "Version : $VERSION"
          echo "Tag     : $FULL_TAG"
          echo "Registry: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}"
          echo "========================================"

      - name: Login to registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.SILICONFLOW_REGISTRY_USERNAME }}
          password: ${{ secrets.SILICONFLOW_REGISTRY_PASSWORD }}

      - name: Check if image already exists
        id: check_existing
        if: ${{ github.event_name != 'pull_request' && github.event.inputs.force_build != 'true' }}
        run: |
          FULL_IMAGE="${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.full_tag }}"
          echo "Checking existing image: $FULL_IMAGE"
          if docker manifest inspect "$FULL_IMAGE" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Image already exists: $FULL_IMAGE. Skip building. (Use force_build=true to override)"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag is unique, proceeding with build."
          fi

      - name: Set up Docker Buildx
        if: ${{ steps.check_existing.outputs.exists != 'true' }}
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        if: ${{ steps.check_existing.outputs.exists != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.full_tag }}
          cache-from: type=gha,scope=qwen3-asr-proxy
          cache-to: type=gha,mode=max,scope=qwen3-asr-proxy

      - name: Print image info
        if: ${{ steps.check_existing.outputs.exists != 'true' && github.event_name != 'pull_request' }}
        run: |
          echo "========================================"
          echo "Build completed successfully!"
          echo "Image: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.full_tag }}"
          echo "========================================"

      - name: Skip notice
        if: ${{ steps.check_existing.outputs.exists == 'true' }}
        run: |
          echo "Image already exists, skipped build."
          echo "Image: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.full_tag }}"
